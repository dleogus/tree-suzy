<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#050b0b" />
<meta name="description" content="수지를 위한 반짝이는 3D ASCII 크리스마스트리" />
<title>For Suzy · A Little Christmas</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#050b0b;color:#f4e7c9}button{font:inherit;cursor:pointer}canvas{display:block;width:100%;height:100%;touch-action:none}.app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 59%,#102219 0%,#07110e 36%,#030809 80%)}.app::after{content:"";pointer-events:none;position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,#0008 100%)}.header{position:absolute;top:max(26px,env(safe-area-inset-top));left:0;right:0;text-align:center;z-index:3;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.43em;color:#b8a784;text-transform:uppercase}.title{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:.055em;margin:11px 0 6px;font-size:clamp(24px,4.7vw,40px);color:#f5e8cf;text-shadow:0 0 24px #e7a65450}.subtitle{font-size:11px;letter-spacing:.16em;color:#a8bbae}.footer{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;z-index:4}.hint{font-size:10px;letter-spacing:.14em;color:#9dafa1;text-align:center;opacity:.85}.controls{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap;padding:0 16px}.btn{border:1px solid #bba77b58;background:#07120ecb;color:#e6d6b6;border-radius:100px;padding:10px 15px;font-size:11px;letter-spacing:.035em;backdrop-filter:blur(12px);transition:.2s}.btn:hover,.btn:focus-visible{border-color:#ddc790;background:#1b2b20;outline:none}.btn.active{border-color:#cbb688;color:#fff4d6;background:#2c3223}.love{position:absolute;bottom:112px;left:0;right:0;text-align:center;pointer-events:none;font:italic 14px Georgia,serif;color:#f2dec0;text-shadow:0 0 14px #f2ca824f;z-index:2;opacity:.9}@media(max-width:650px){.love{bottom:180px;padding:0 18px;font-size:13px}.hint{font-size:9px}.footer{gap:10px}.controls{gap:8px}.btn{padding:9px 12px}}.credit{position:absolute;bottom:8px;right:12px;color:#768b7e;font-size:9px;letter-spacing:.04em;z-index:3}.loading{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#c1af88;z-index:0}@media(max-height:660px){.header{top:14px}.title{font-size:23px;margin:5px 0}.love{bottom:152px}.footer{bottom:13px;gap:8px}.btn{padding:8px 11px}}@media(prefers-reduced-motion:reduce){.hint{display:none}}
</style>
</head>
<body>
<main class="app" aria-label="수지를 위한 크리스마스트리 애니메이션">
<div class="loading" id="loading">MAKING CHRISTMAS MAGIC ...</div>
<canvas id="scene" aria-label="회전하는 초록색 ASCII 트리와 반짝이는 전구, 내리는 눈"></canvas>
<header class="header"><div class="eyebrow">A LITTLE CHRISTMAS MAGIC</div><h1 class="title">Merry Christmas, Suzy</h1><div class="subtitle">made with love, one tiny light at a time</div></header>
<div class="love">Every little light is a wish for you.</div>
<div class="footer"><div class="hint">드래그해서 회전 · 터치해서 반짝임을 느껴보세요</div><nav class="controls" aria-label="트리 설정"><button class="btn active" id="spin" aria-pressed="true">↻ 자동 회전</button><button class="btn active" id="snow" aria-pressed="true">❄ 눈 내리기</button><button class="btn" id="lights" aria-pressed="false">✦ 반짝임 더하기</button><button class="btn" id="save">↓ 사진 저장</button></nav></div>
<div class="credit">TREE-SUZY · 2026</div>
</main>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false}),loading=document.getElementById('loading');
const TAU=Math.PI*2,random=(a,b)=>a+Math.random()*(b-a);
let W=0,H=0,dpr=1,scale=1,centerX=0,centerY=0,angle=0,tilt=-0.10,last=0,auto=true,snowOn=true,extra=false,drag=false,prevX=0,prevY=0,twinkle=0;
const points=[],flakes=[],stars=[];
const leaves=['+','*','·','.',':','✦','˖','✧','•','x'];
const greens=['#193e29','#225d35','#287b3c','#327e42','#43a455','#68ba6b','#9bce89'];
const lights=['#ffe4a1','#ffce73','#fff3cf','#ec7963','#ecb356','#add9bd','#f0f3de'];
function add(x,y,z,ch,color,size,glow=0,phase=random(0,TAU)){points.push({x,y,z,ch,color,size,glow,phase})}
function makeTree(){
 points.length=0;
 // 3D conical foliage, built from independently moving twinkling glyphs.
 for(let i=0;i<6900;i++){
  const y=random(-2.42,2.42),t=(2.42-y)/4.84;
  const maxR=.055+1.62*t;
  const layer=Math.pow(Math.random(),.52);
  const r=maxR*(.78+layer*.24)*random(.89,1.08);
  const a=random(0,TAU);
  const x=r*Math.cos(a),z=r*Math.sin(a);
  const leaf=leaves[(Math.random()*leaves.length)|0];
  add(x,y+Math.sin(a*7+y*9)*.025,z,leaf,greens[(Math.random()*greens.length)|0],random(.055,.103),Math.random()<.11?.35:0);
 }
 // Decorative spiraling garlands and glowing bulbs.
 for(let i=0;i<1450;i++){
  const t=i/1450, y=2.28-t*4.55;
  const a=t*TAU*7.2+.7;
  const r=(.09+1.6*(1-(y+2.42)/4.84))*1.035;
  add(r*Math.cos(a),y,r*Math.sin(a),i%7===0?'✦':'.',i%5===0?'#f9df9e':'#b8a47a',random(.05,.083),.6);
 }
 for(let i=0;i<270;i++){
  const t=random(.07,.99),y=2.42-t*4.84;
  const a=random(0,TAU),r=(.055+1.62*t)*1.075;
  add(r*Math.cos(a),y,r*Math.sin(a),Math.random()<.35?'✦':'●',lights[(Math.random()*lights.length)|0],random(.08,.16),1);
 }
 // Tiny golden crown/star.
 for(let i=0;i<155;i++){
  const a=random(0,TAU),r=Math.sqrt(Math.random())*.26;
  const tip=Math.max(0,Math.cos(a*5));
  add(r*Math.cos(a),2.54+r*tip*.8+random(-.09,.09),r*Math.sin(a),'✦',['#fff1c6','#ffe49b','#fbcd67'][i%3],random(.06,.12),1);
 }
 // Trunk.
 for(let i=0;i<230;i++){const a=random(0,TAU),r=random(0,.19);add(Math.cos(a)*r,-2.7+random(-.2,.45),Math.sin(a)*r,[':', '|','+','.'][i%4],'#81654b',random(.06,.095))}
}
function initialize(){
 dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
 // Draw in CSS pixels while retaining a sharp high-DPI backing buffer.
 ctx.setTransform(dpr,0,0,dpr,0,0);
 centerX=W*.5;
 // On phones, center the complete tree within the visible area between
 // the heading and bottom controls instead of aligning it to the canvas top.
 if(W<650){
  const safeTop=Math.max(145,H*.19);
  const safeBottom=H-Math.max(150,H*.19);
  const availableHeight=Math.max(220,safeBottom-safeTop);
  centerY=(safeTop+safeBottom)/2+12;
  scale=Math.min(W/4.35,availableHeight/5.55,155);
 }else{
  centerY=H*.53;
  scale=Math.min(W/4.35,H/6.6,155);
 }
 flakes.length=0;stars.length=0;
 for(let i=0;i<Math.min(160,Math.floor(W*H/5200));i++)flakes.push({x:random(0,W),y:random(0,H),r:random(.4,1.5),v:random(.25,.95),s:random(-.25,.3),p:random(0,TAU)});
 for(let i=0;i<100;i++)stars.push({x:random(0,W),y:random(0,H),r:random(.3,1.15),p:random(0,TAU)});
}
function project(p){
 const c=Math.cos(angle),s=Math.sin(angle),ct=Math.cos(tilt),st=Math.sin(tilt);
 const rx=p.x*c-p.z*s,rz=p.x*s+p.z*c;
 const ry=p.y*ct-rz*st,depth=p.y*st+rz*ct;
 const persp=6.5/(6.5-depth*.22);
 return {x:centerX+rx*scale*persp,y:centerY-ry*scale*persp,depth,persp};
}
function draw(t){
 const dt=Math.min((t-last)||16,50);last=t;twinkle+=dt*.001;
 if(auto&&!drag)angle+=dt*.00020;
 ctx.fillStyle='#040a09';ctx.fillRect(0,0,W,H);
 // atmospheric halo
 let halo=ctx.createRadialGradient(centerX,centerY,scale*.1,centerX,centerY,scale*3.25);
 halo.addColorStop(0,'rgba(20,64,38,.35)');halo.addColorStop(.55,'rgba(8,31,20,.18)');halo.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=halo;ctx.fillRect(0,0,W,H);
 for(const s of stars){const alpha=.2+.34*(.5+.5*Math.sin(twinkle*.55+s.p));ctx.fillStyle='rgba(209,224,214,'+alpha+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill()}
 if(snowOn){ctx.fillStyle='rgba(224,240,235,.59)';for(const f of flakes){f.y+=f.v*dt*.055;f.x+=Math.sin(twinkle+f.p)*dt*.008+f.s*dt*.013;if(f.y>H+3)f.y=-4;if(f.x>W+3)f.x=-3;if(f.x< -3)f.x=W+3;ctx.globalAlpha=.25+f.r*.34;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,TAU);ctx.fill()}ctx.globalAlpha=1}
 // ground reflection
 ctx.strokeStyle='rgba(112,153,118,.11)';ctx.lineWidth=.5;
 const groundY=centerY+scale*2.75;
 for(let i=0;i<16;i++){let gy=groundY+i*i*.15;ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke()}
 for(let i=-16;i<=16;i++){ctx.beginPath();ctx.moveTo(centerX+i*scale*.27,groundY);ctx.lineTo(centerX+i*scale*.8,H);ctx.stroke()}
 const projected=points.map(p=>({p,q:project(p)}));projected.sort((a,b)=>a.q.depth-b.q.depth);
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(const {p,q} of projected){
   if(q.x< -20||q.x>W+20||q.y< -20||q.y>H+20)continue;
   const flicker=.58+.42*Math.sin(twinkle*(extra?4.5:2.15)+p.phase+q.depth*1.7);
   ctx.globalAlpha=p.glow?(.55+.45*flicker):(.56+.22*flicker);
   const px=Math.max(5,p.size*scale*q.persp);
   ctx.font=px.toFixed(1)+'px monospace';
   if(p.glow&&flicker>.65){ctx.shadowColor=p.color;ctx.shadowBlur=extra?15:8}else ctx.shadowBlur=0;
   ctx.fillStyle=p.color;ctx.fillText(p.ch,q.x,q.y);
 }
 ctx.globalAlpha=1;ctx.shadowBlur=0;
 // a soft glowing topper
 const top=project({x:0,y:2.60,z:0});
 const glow=ctx.createRadialGradient(top.x,top.y,1,top.x,top.y,scale*.32);
 glow.addColorStop(0,'rgba(255,236,174,.27)');glow.addColorStop(1,'rgba(255,236,174,0)');
 ctx.fillStyle=glow;ctx.beginPath();ctx.arc(top.x,top.y,scale*.32,0,TAU);ctx.fill();
 requestAnimationFrame(draw);
}
canvas.addEventListener('pointerdown',e=>{drag=true;prevX=e.clientX;prevY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;angle+=(e.clientX-prevX)*.009;tilt=Math.max(-.48,Math.min(.48,tilt+(e.clientY-prevY)*.003));prevX=e.clientX;prevY=e.clientY});
canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
function toggle(id,get,set){const btn=document.getElementById(id);btn.addEventListener('click',()=>{const value=!get();set(value);btn.classList.toggle('active',value);btn.setAttribute('aria-pressed',String(value))})}
toggle('spin',()=>auto,v=>auto=v);toggle('snow',()=>snowOn,v=>snowOn=v);toggle('lights',()=>extra,v=>extra=v);
document.getElementById('save').addEventListener('click',()=>{
 const exportCanvas=document.createElement('canvas');exportCanvas.width=canvas.width;exportCanvas.height=canvas.height;
 const c=exportCanvas.getContext('2d');c.drawImage(canvas,0,0);c.scale(dpr,dpr);
 c.textAlign='center';c.font='24px Georgia, serif';c.fillStyle='#f6e7c8';c.fillText('Merry Christmas, Suzy',W/2,Math.max(42,H*.11));
 const a=document.createElement('a');a.href=exportCanvas.toDataURL('image/png');a.download='christmas-for-suzy.png';a.click();
});
window.addEventListener('resize',initialize,{passive:true});makeTree();initialize();loading.remove();requestAnimationFrame(draw);
})();
</script>
</body></html>
